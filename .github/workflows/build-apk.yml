name: Android APK oluştur
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: ZIP içindeki orijinal PWA dosyalarını çıkar
        run: |
          test -f siparis_takip_pwa.zip
          mkdir -p app/src/main/assets
          unzip -o siparis_takip_pwa.zip -d app/src/main/assets
          test -s app/src/main/assets/index.html
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK paketlerini kur
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        run: gradle assembleDebug
      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: siparis-takip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
